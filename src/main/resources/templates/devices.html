<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Сетевое оборудование</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <!-- Логотип -->
    <a class="navbar-brand" th:href="@{/devices}">Network System</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <!-- Левая часть: ссылки -->
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" th:href="@{/devices}">Устройства</a>
        </li>
      </ul>

      <!-- Правая часть: профиль и выход -->
      <!-- d-flex и ms-auto прижимают этот блок к правому краю -->
      <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-light">
                    Привет, <strong sec:authentication="name"></strong>!
                </span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button type="submit" class="btn btn-outline-light btn-sm">Выйти</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<!-- Основной контент -->
<div class="container">
  <h2>Сетевое оборудование</h2>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Тип</th>
      <th>Модель</th>
      <th>Серийный номер</th>
      <th>IP</th>
      <th>Статус</th>
      <th>Локация</th>
      <!-- Колонки "Действия" тут НЕТ -->
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${devices}">
      <td th:text="${d.id}"></td>
      <td th:text="${d.deviceType}"></td>
      <td th:text="${d.model}"></td>
      <td th:text="${d.serialNumber}"></td>
      <td th:text="${d.ipAddress}"></td>
      <td th:text="${d.status}"></td>
      <td th:text="${d.location != null ? d.location.name : '—'}"></td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
