<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <title>Управление устройствами</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" th:href="@{/devices}">Network System</a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/admin/devices}">Устройства</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/locations}">Локации</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('ADMIN')">
          <a class="nav-link" th:href="@{/admin/users}">Пользователи</a>
        </li>
      </ul>
      <div class="d-flex align-items-center gap-3">
                <span class="text-light">
                    Привет, <strong sec:authentication="name">User</strong>!
                </span>
        <form th:action="@{/logout}" method="post" class="m-0">
          <button type="submit" class="btn btn-outline-light">Выйти</button>
        </form>
      </div>
    </div>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Управление устройствами</h2>
    <a th:href="@{/admin/devices/add}" class="btn">+ Добавить устройство</a>
  </div>

  <table>
    <thead>
    <tr>
      <th>ID</th>
      <th>Тип</th>
      <th>Модель</th>
      <th>Серийный номер</th>
      <th>IP</th>
      <th>Статус</th>
      <th>Локация</th>
      <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${devices}">
      <td th:text="${d.id}"></td>
      <td th:text="${d.deviceType}"></td>
      <td th:text="${d.model}"></td>
      <td th:text="${d.serialNumber}"></td>
      <td th:text="${d.ipAddress}"></td>
      <td th:text="${d.status}"></td>
      <td th:text="${d.location != null ? d.location.name : '—'}"></td>
      <td>
        <div class="d-flex align-items-center gap-2">
          <a th:href="@{/admin/devices/edit/{id}(id=${d.id})}" class="btn">Редактировать</a>
          <form th:action="@{/admin/devices/delete/{id}(id=${d.id})}" method="post" class="m-0">
            <button type="submit" class="btn btn-danger" onclick="return confirm('Удалить устройство?')">Удалить</button>
          </form>
        </div>
      </td>
    </tr>
    </tbody>
  </table>
</div>

</body>
</html>
