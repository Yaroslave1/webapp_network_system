<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${user.id != null ? 'Редактировать пользователя' : 'Новый пользователь'}">Форма</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    :root {
        --primary: #2563eb;
        --primary-dark: #1e40af;
        --bg: #f1f5f9;
        --card: #ffffff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
        font-family:'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 40px 16px;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 520px;
    }

    h2 {
        margin: 0 0 8px;
        font-size: 1.6rem;
    }

    .subtitle {
        color: var(--muted);
        margin: 0 0 24px;
        font-size: 0.95rem;
    }

    .back-link {
        display: inline-block;
        margin-bottom: 20px;
        color: var(--primary);
        text-decoration: none;
        font-size: 0.95rem;
    }

    .back-link:hover { text-decoration: underline; }

    .form-card {
        background: var(--card);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 28px;
    }

    .form-group { margin-bottom: 18px; }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        font-size: 0.9rem;
    }

    .hint {
        color: var(--muted);
        font-weight: 400;
    }

    input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        background: #fff;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .actions {
        margin-top: 24px;
        display: flex;
        gap: 12px;
    }

    .btn {
        padding: 11px 22px;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.2s;
    }

    .btn-primary {
        background: var(--primary);
        color: #fff;
    }

    .btn-primary:hover { background: var(--primary-dark); }

    .btn-secondary {
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
    }

    .btn-secondary:hover {
        background: var(--bg);
        color: var(--text);
    }
  </style>
</head>
<body>
<div class="container" style="max-width: 600px;">
  <h2 th:text="${user.id != null ? 'Редактировать пользователя' : 'Добавить пользователя'}">Форма</h2>
  <a th:href="@{/admin/users}" class="back-link"> ← Назад к списку</a>

  <form th:action="@{/admin/users/save}" method="post">
    <input type="hidden" th:if="${user.id != null}" name="id" th:value="${user.id}">

    <div class="mb-3">
      <label>Логин:</label>
      <input type="text" name="username" class="form-control" th:value="${user.username}" required>
    </div>

    <div class="mb-3">
      <label>Пароль:</label>
      <input type="password" name="password" class="form-control"
             th:required="${user.id == null}"
             th:placeholder="${user.id != null ? 'Оставьте пустым, чтобы не менять' : 'Введите пароль'}">
    </div>

    <div class="mb-3">
      <label>Роль:</label>
      <select name="roles" class="form-select" required>
        <option th:each="r : ${roles}"
                th:value="${r}"
                th:text="${r}"
                th:selected="${user.roles != null && user.roles.contains(r)}">
        </option>
      </select>
    </div>

    <button type="submit" class="btn">Сохранить</button>
  </form>
</div>
</body>
</html>
