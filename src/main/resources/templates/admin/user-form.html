<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${user.id != null ? 'Редактировать пользователя' : 'Новый пользователь'}">Форма</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container" style="max-width: 600px;">
  <h2 th:text="${user.id != null ? 'Редактировать пользователя' : 'Добавить пользователя'}">Форма</h2>
  <p><a th:href="@{/admin/users}" class="btn btn-secondary">← Назад к списку</a></p>

  <form th:action="@{/admin/users/save}" method="post">
    <!-- Скрытый ID для редактирования -->
    <input type="hidden" th:if="${user.id != null}" name="id" th:value="${user.id}">

    <div class="mb-3">
      <label>Логин:</label>
      <!-- ВНИМАНИЕ: name="username" должен совпадать с полем в классе User -->
      <input type="text" name="username" class="form-control" th:value="${user.username}" required>
    </div>

    <div class="mb-3">
      <label>Пароль:</label>
      <!-- ВНИМАНИЕ: name="password" свяжет поле напрямую с user.password -->
      <input type="password" name="password" class="form-control"
             th:required="${user.id == null}"
             th:placeholder="${user.id != null ? 'Оставьте пустым, чтобы не менять' : 'Введите пароль'}">
    </div>

    <div class="mb-3">
      <label>Роль:</label>
      <!-- name="roles" свяжет выбор с коллекцией Set<Role> roles -->
      <select name="roles" class="form-select" required>
        <option th:each="r : ${roles}"
                th:value="${r}"
                th:text="${r}"
                th:selected="${user.roles != null && user.roles.contains(r)}">
        </option>
      </select>
    </div>

    <button type="submit" class="btn">Сохранить</button>
  </form>
</div>
</body>
</html>
