<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${location.id != null ? 'Редактировать локацию' : 'Новая локация'}">Форма</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; }

        body {
            font-family:'Roboto', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 520px;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 1.6rem;
        }

        .subtitle {
            color: var(--muted);
            margin: 0 0 24px;
            font-size: 0.95rem;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .back-link:hover { text-decoration: underline; }

        .form-card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 28px;
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .hint {
            color: var(--muted);
            font-weight: 400;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .actions {
            margin-top: 24px;
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover { background: var(--primary-dark); }

        .btn-secondary {
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--bg);
            color: var(--text);
        }
    </style>
</head>
<body>
<div class="container">
    <a th:href="@{/admin/locations}" class="back-link">← Вернуться к списку локаций</a>

    <h2 th:text="${location.id != null ? 'Редактировать локацию' : 'Добавить новую локацию'}">Форма</h2>
    <p class="subtitle">Укажите место, где установлено сетевое оборудование.</p>

    <form th:action="@{/admin/locations/save}" method="post" class="form-card">
        <input type="hidden" name="id" th:if="${location.id != null}" th:value="${location.id}">

        <div class="form-group">
            <label for="name">Название <span class="hint">(обязательно)</span></label>
            <input type="text" id="name" name="name" th:value="${location.name}"
                   placeholder="Например: Серверная 205" required>
        </div>

        <div class="form-group">
            <label for="address">Адрес</label>
            <input type="text" id="address" name="address" th:value="${location.address}"
                   placeholder="Например: корпус Б, 2 этаж">
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <input type="text" id="description" name="description" th:value="${location.description}"
                   placeholder="Комментарий к локации">
        </div>

        <div class="actions">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/admin/locations}" class="btn btn-secondary">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
