<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список локаций</title>
</head>
<body>
<h2>Управление локациями</h2>

<!-- Форма добавления или редактирования -->
<h3 th:text="${location.id != null ? 'Редактировать локацию' : 'Добавить новую локацию'}">Форма</h3>

<form th:action="@{/admin/locations/save}" method="post">
  <!-- Скрытое поле для ID (нужно при редактировании) -->
  <input type="hidden" name="id" th:value="${location.id}">

  <div>
    <label>Название: </label>
    <input type="text" name="name" th:value="${location.name}" required>
  </div>
  <div>
    <label>Адрес: </label>
    <input type="text" name="address" th:value="${location.address}">
  </div>
  <div>
    <label>Описание: </label>
    <input type="text" name="description" th:value="${location.description}">
  </div>

  <button type="submit">Сохранить</button>

  <!-- Ссылка для отмены редактирования -->
  <a th:if="${location.id != null}" th:href="@{/admin/locations}">Отмена</a>
</form>

<hr>

<!-- Таблица со списком всех локаций -->
<h3>Список локаций</h3>
<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Название</th>
    <th>Адрес</th>
    <th>Описание</th>
    <th>Действия</th>
  </tr>
  </thead>
  <tbody>
  <!-- Цикл по всем локациям -->
  <tr th:each="loc : ${locations}">
    <td th:text="${loc.id}"></td>
    <td th:text="${loc.name}"></td>
    <td th:text="${loc.address}"></td>
    <td th:text="${loc.description}"></td>
    <td>
      <a th:href="@{/admin/locations/edit/{id}(id=${loc.id})}">Редактировать</a>

      <form th:action="@{/admin/locations/delete/{id}(id=${loc.id})}" method="post" style="display:inline;">
        <button type="submit" onclick="return confirm('Удалить локацию?')">Удалить</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
