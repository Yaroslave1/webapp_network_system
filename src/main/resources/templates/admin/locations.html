<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Список локаций</title>
</head>
<body>
<h2>Управление локациями</h2>

<p><a th:href="@{/admin/locations/add}">+ Добавить новую локацию</a></p>
<p><a th:href="@{/admin/devices}">← Перейти к устройствам</a></p>

<table border="1">
  <thead>
  <tr>
    <th>ID</th>
    <th>Название</th>
    <th>Адрес</th>
    <th>Описание</th>
    <th>Действия</th>
  </tr>
  </thead>
  <tbody>
  <!-- Цикл по всем локациям -->
  <tr th:each="loc : ${locations}">
    <td th:text="${loc.id}"></td>
    <td th:text="${loc.name}"></td>
    <td th:text="${loc.address}"></td>
    <td th:text="${loc.description}"></td>
    <td>
      <a th:href="@{/admin/locations/edit/{id}(id=${loc.id})}">Редактировать</a>

      <form th:action="@{/admin/locations/delete/{id}(id=${loc.id})}" method="post" style="display:inline;">
        <button type="submit" onclick="return confirm('Удалить локацию?')">Удалить</button>
      </form>
    </td>
  </tr>
  </tbody>
</table>
</body>
</html>
